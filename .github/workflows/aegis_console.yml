name: aegis-console

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "SIMULATE | VALIDATE | EXECUTE"
        required: true
        default: "EXECUTE"
        type: choice
        options:
          - SIMULATE
          - VALIDATE
          - EXECUTE
      intent:
        description: "User intent text"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Init console workspace
        run: |
          rm -rf .aegis_console
          mkdir -p .aegis_console
          echo "${{ inputs.mode }}" > .aegis_console/mode.txt
          printf "%s" "${{ inputs.intent }}" > .aegis_console/intent.txt
          echo "false" > .aegis_console/should_execute.txt

      # -------------------------
      # SIMULATE (CLI) -> capture stdout JSON
      # -------------------------
      - name: Agent simulate (CLI)
        id: simulate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          # NOT setting DESTINATION_ADDRESS on purpose -> orchestrator falls back to 0x...dEaD
        run: |
          set +e
          npm run agent:simulate -- "${{ inputs.intent }}" 1> .aegis_console/simulate.stdout.log 2> .aegis_console/simulate.stderr.log
          echo $? > .aegis_console/simulate.exitcode.txt
          set -e

          # Extract first JSON object from stdout
          node - << 'NODE'
          const fs = require("fs");
          const p = ".aegis_console/simulate.stdout.log";
          const t = fs.readFileSync(p, "utf8");
          const m = t.match(/\{[\s\S]*\}\s*$/m);
          if (!m) {
            fs.writeFileSync(".aegis_console/simulate.extract_error.log", "No JSON object found in stdout.\n" + t.slice(0, 4000));
            process.exit(0);
          }
          fs.writeFileSync(".aegis_console/simulate.json", m[0].trim() + "\n");
          NODE

      # -------------------------
      # VALIDATE (CLI) -> capture stdout JSON
      # -------------------------
      - name: Agent validate (CLI)
        id: validate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ARC_TESTNET_RPC_PRIMARY: ${{ secrets.ARC_TESTNET_RPC_PRIMARY }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          # NOT setting DESTINATION_ADDRESS on purpose -> orchestrator falls back to 0x...dEaD
        run: |
          set +e
          npm run agent:validate -- "${{ inputs.intent }}" 1> .aegis_console/validate.stdout.log 2> .aegis_console/validate.stderr.log
          echo $? > .aegis_console/validate.exitcode.txt
          set -e

          node - << 'NODE'
          const fs = require("fs");
          const p = ".aegis_console/validate.stdout.log";
          const t = fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "";
          const m = t.match(/\{[\s\S]*\}\s*$/m);
          if (!m) {
            fs.writeFileSync(".aegis_console/validate.extract_error.log", "No JSON object found in stdout.\n" + t.slice(0, 4000));
            process.exit(0);
          }
          fs.writeFileSync(".aegis_console/validate.json", m[0].trim() + "\n");
          NODE

          # Determine should_execute gate
          node - << 'NODE'
          const fs = require("fs");
          const vPath = ".aegis_console/validate.json";
          if (!fs.existsSync(vPath)) process.exit(0);
          const v = JSON.parse(fs.readFileSync(vPath, "utf8"));
          const ok = v && v.status === "APPROVED_READY";
          fs.writeFileSync(".aegis_console/should_execute.txt", ok ? "true" : "false");
          fs.writeFileSync(".aegis_console/validate_status.txt", (v && v.status) ? String(v.status) : "");
          NODE

      # -------------------------
      # EXECUTE via Circle scripts (ONLY if mode EXECUTE + gate true)
      # -------------------------
      - name: Preflight Circle env (execute only)
        if: ${{ inputs.mode == 'EXECUTE' }}
        run: |
          SHOULD=$(cat .aegis_console/should_execute.txt 2>/dev/null || echo "false")
          if [ "${SHOULD}" != "true" ]; then
            echo "Skip preflight (should_execute=false)"
            exit 0
          fi

          test -n "${CIRCLE_API_KEY}" || (echo "Missing CIRCLE_API_KEY" && exit 1)
          test -n "${CIRCLE_ENTITY_SECRET_HEX}" || (echo "Missing CIRCLE_ENTITY_SECRET_HEX" && exit 1)
          test -n "${CIRCLE_WALLET_ID_AGENT}" || (echo "Missing CIRCLE_WALLET_ID_AGENT" && exit 1)
          test -n "${VAULT_ADDRESS}" || (echo "Missing VAULT_ADDRESS" && exit 1)
          test -n "${CIRCLE_BLOCKCHAIN}" || (echo "Missing CIRCLE_BLOCKCHAIN" && exit 1)
          echo "OK env present."
        env:
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          CIRCLE_ENTITY_SECRET_HEX: ${{ secrets.CIRCLE_ENTITY_SECRET_HEX }}
          CIRCLE_WALLET_ID_AGENT: ${{ secrets.CIRCLE_WALLET_ID_AGENT }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
          CIRCLE_BLOCKCHAIN: ${{ secrets.CIRCLE_BLOCKCHAIN }}

      - name: Circle 07_callSpend_vault.ts (execute only)
        if: ${{ inputs.mode == 'EXECUTE' }}
        env:
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          CIRCLE_ENTITY_SECRET_HEX: ${{ secrets.CIRCLE_ENTITY_SECRET_HEX }}
          CIRCLE_BASE_URL: ${{ secrets.CIRCLE_BASE_URL }}
          CIRCLE_BLOCKCHAIN: ${{ secrets.CIRCLE_BLOCKCHAIN }}
          CIRCLE_WALLET_ID_AGENT: ${{ secrets.CIRCLE_WALLET_ID_AGENT }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
        run: |
          SHOULD=$(cat .aegis_console/should_execute.txt 2>/dev/null || echo "false")
          if [ "${SHOULD}" != "true" ]; then
            echo "Skip execute (should_execute=false)"
            exit 0
          fi

          # Pull to/amount from simulate.json
          node - << 'NODE'
          const fs = require("fs");
          const s = JSON.parse(fs.readFileSync(".aegis_console/simulate.json","utf8"));
          const to = s.to;
          const amt = String(s.amount);
          fs.writeFileSync(".aegis_console/exec_to.txt", to);
          fs.writeFileSync(".aegis_console/exec_amount.txt", amt);
          NODE

          TO_ADDR=$(cat .aegis_console/exec_to.txt)
          AMT=$(cat .aegis_console/exec_amount.txt)

          export SPEND_ABI_PARAMS_JSON=$(node -e 'const fs=require("fs");const to=fs.readFileSync(".aegis_console/exec_to.txt","utf8").trim();const amt=fs.readFileSync(".aegis_console/exec_amount.txt","utf8").trim();process.stdout.write(JSON.stringify([to,String(amt)]))')
          echo "SPEND_ABI_PARAMS_JSON=${SPEND_ABI_PARAMS_JSON}" >> $GITHUB_ENV

          set +e
          npx ts-node scripts/circle/07_callSpend_vault.ts 1> .aegis_console/run07.stdout.log 2> .aegis_console/run07.stderr.log
          echo $? > .aegis_console/run07.exitcode.txt
          set -e

          # Extract circleTxId
          CIRCLE_TX_ID=$(grep -Eo 'circleTxId:\s*[A-Za-z0-9-]+' .aegis_console/run07.stdout.log | head -n 1 | sed -E 's/circleTxId:\s*//')
          if [ -z "${CIRCLE_TX_ID}" ]; then
            echo "Failed to parse circleTxId from 07 stdout"
            exit 1
          fi

          echo "${CIRCLE_TX_ID}" > .aegis_console/circleTxId.txt
          echo "CIRCLE_TX_ID=${CIRCLE_TX_ID}" >> $GITHUB_ENV

      - name: Circle 06_waitTx.ts (execute only)
        if: ${{ inputs.mode == 'EXECUTE' }}
        env:
          CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
          CIRCLE_BASE_URL: ${{ secrets.CIRCLE_BASE_URL }}
          CIRCLE_TX_ID: ${{ env.CIRCLE_TX_ID }}
        run: |
          SHOULD=$(cat .aegis_console/should_execute.txt 2>/dev/null || echo "false")
          if [ "${SHOULD}" != "true" ]; then
            echo "Skip wait (should_execute=false)"
            exit 0
          fi

          set +e
          npx ts-node scripts/circle/06_waitTx.ts 1> .aegis_console/run06.stdout.log 2> .aegis_console/run06.stderr.log
          echo $? > .aegis_console/run06.exitcode.txt
          set -e

          # Extract txHash (support both patterns)
          TX_HASH=$(grep -Eo '✅ On-chain txHash:\s*0x[0-9a-fA-F]{64}' .aegis_console/run06.stdout.log | head -n 1 | sed -E 's/✅ On-chain txHash:\s*//')
          if [ -z "${TX_HASH}" ]; then
            TX_HASH=$(grep -Eo 'txHash=0x[0-9a-fA-F]{64}' .aegis_console/run06.stdout.log | head -n 1 | sed -E 's/txHash=//')
          fi

          if [ -z "${TX_HASH}" ]; then
            echo "Failed to parse txHash from 06 stdout"
            exit 1
          fi

          echo "${TX_HASH}" > .aegis_console/txHash.txt

          ARCSCAN_BASE="https://testnet.arcscan.app/tx/"
          echo "${ARCSCAN_BASE}${TX_HASH}" > .aegis_console/arcscan.txt

      # -------------------------
      # Build console_result.json (artifact consumed by UI)
      # -------------------------
      - name: Build console_result.json
        run: |
          node - << 'NODE'
          const fs = require("fs");

          const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "");
          const readJSON = (p) => {
            try {
              const t = read(p).trim();
              if (!t) return null;
              return JSON.parse(t);
            } catch (e) {
              return { _parseError: String(e), _raw: read(p).slice(0, 4000) };
            }
          };

          const mode = read(".aegis_console/mode.txt").trim();
          const intent = read(".aegis_console/intent.txt");

          const simulate = readJSON(".aegis_console/simulate.json");
          const validate = readJSON(".aegis_console/validate.json");

          const shouldExecute = read(".aegis_console/should_execute.txt").trim() === "true";

          const circleTxId = read(".aegis_console/circleTxId.txt").trim();
          const txHash = read(".aegis_console/txHash.txt").trim();
          const arcscan = read(".aegis_console/arcscan.txt").trim();

          const simulateErr = read(".aegis_console/simulate.stderr.log").trim();
          const validateErr = read(".aegis_console/validate.stderr.log").trim();

          const res = {
            mode,
            intent,
            simulate,
            validate,
            execute: null,
            errors: {
              simulateStderr: simulateErr || null,
              validateStderr: validateErr || null,
            },
            meta: {
              shouldExecute,
              workflow: "aegis-console",
            }
          };

          if (mode === "EXECUTE") {
            if (!validate || validate?.status !== "APPROVED_READY") {
              res.execute = {
                status: "BLOCKED",
                reason: validate?.reason || "Blocked by validation gate.",
                message: "No execution occurred. Funds did not move."
              };
            } else if (!shouldExecute) {
              res.execute = {
                status: "BLOCKED",
                reason: "Validation approved but execution gate did not run.",
                message: "No execution occurred. Funds did not move."
              };
            } else if (txHash) {
              res.execute = {
                status: "APPROVED",
                circleTxId: circleTxId || null,
                txHash,
                arcscan: arcscan || null
              };
            } else {
              res.execute = {
                status: "ERROR",
                reason: "Execution attempted but txHash could not be extracted.",
                message: "Execution may have failed. See logs."
              };
            }
          }

          fs.writeFileSync("console_result.json", JSON.stringify(res, null, 2));
          console.log("Wrote console_result.json");
          NODE

      - name: Upload artifact (console_result.json)
        uses: actions/upload-artifact@v4
        with:
          name: aegis-console-result
          path: console_result.json
          retention-days: 1

      # -------------------------
      # Human-readable Summary (console + GitHub summary with clickable Arcscan link)
      # -------------------------
      - name: Summary human-readable
        run: |
          node - << 'NODE'
          const fs = require("fs");

          const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "");
          const safe = (v) => (v === undefined || v === null || v === "" ? "(no output)" : v);

          const res = JSON.parse(fs.readFileSync("console_result.json","utf8"));

          const sim = res.simulate || {};
          const val = res.validate || {};
          const v = (val.vault || {});
          const exe = res.execute || null;

          const lines = [];
          lines.push("========================================");
          lines.push("AEGIS Agent Console — Workflow Summary");
          lines.push("========================================");
          lines.push(`Mode:   ${res.mode}`);
          lines.push(`Intent: ${String(res.intent || "").trim()}`);
          lines.push("");
          lines.push("SIMULATE");
          lines.push(`- to:       ${safe(sim.to)}`);
          lines.push(`- amount:   ${safe(sim.amount)}`);
          lines.push(`- currency: ${safe(sim.currency)}`);
          lines.push(`- reason:   ${safe(sim.reason)}`);
          lines.push("");
          lines.push("VALIDATE");
          lines.push(`- status: ${safe(val.status)}`);
          lines.push(`- reason: ${safe(val.reason)}`);
          lines.push("VAULT STATE");
          lines.push(`- maxPerTx:    ${safe(v.maxPerTx)}`);
          lines.push(`- dailyLimit:  ${safe(v.dailyLimit)}`);
          lines.push(`- spentToday:  ${safe(v.spentToday)}`);
          lines.push("");

          if (res.mode === "EXECUTE") {
            lines.push("EXECUTE");
            lines.push(`- status: ${safe(exe && exe.status)}`);
            if (exe && exe.status === "APPROVED") {
              lines.push(`- txHash:  ${safe(exe.txHash)}`);
              lines.push(`- arcscan: ${safe(exe.arcscan)}`);
              lines.push(`- circleTxId: ${safe(exe.circleTxId)}`);
            } else if (exe && exe.status === "BLOCKED") {
              lines.push(`- reason: ${safe(exe.reason)}`);
              lines.push(`- note:   No execution occurred. Funds did not move.`);
            } else {
              lines.push(`- reason: ${safe(exe && exe.reason)}`);
            }
            lines.push("");
          }

          lines.push("Artifact: aegis-console-result / console_result.json");
          lines.push("========================================");

          console.log(lines.join("\n"));

          // GitHub Step Summary (with clickable link)
          let md = "";
          md += "## AEGIS Agent Console — Summary\n\n";
          md += `**Artifact:** \`aegis-console-result / console_result.json\`\n\n`;
          md += `- **Mode:** \`${res.mode}\`\n`;
          md += `- **Intent:** \`${String(res.intent || "").trim()}\`\n\n`;
          md += `> Observational UI. Enforcement happens on-chain.\n\n`;

          if (res.mode === "EXECUTE" && exe && exe.status === "APPROVED") {
            md += `- **txHash:** \`${exe.txHash}\`\n`;
            if (exe.arcscan) md += `- **Arcscan:** [View transaction](${exe.arcscan})\n`;
            if (exe.circleTxId) md += `- **circleTxId:** \`${exe.circleTxId}\`\n`;
            md += "\n";
          } else if (res.mode === "EXECUTE" && exe && exe.status === "BLOCKED") {
            md += `- **Status:** \`BLOCKED\`\n`;
            md += `- **Reason:** ${exe.reason || "Blocked by validation gate."}\n`;
            md += `- **Note:** No execution occurred. Funds did not move.\n\n`;
          }

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
          NODE
