name: aegis-console

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "SIMULATE | VALIDATE | EXECUTE"
        required: true
        type: choice
        options:
          - SIMULATE
          - VALIDATE
          - EXECUTE
      intent:
        description: "Natural language intent (e.g. Buy 1 USDC coffee)"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      # Workspace ALWAYS exists (hidden folder)
      - name: Init console workspace
        run: |
          mkdir -p .aegis_console
          echo "${{ inputs.mode }}" > .aegis_console/mode.txt
          echo "${{ inputs.intent }}" > .aegis_console/intent.txt

      # -------------------------
      # SIMULATE (Gemini → JSON)
      # -------------------------
      - name: Agent simulate (stdout JSON)
        id: simulate
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DESTINATION_ADDRESS: ${{ secrets.DESTINATION_ADDRESS }}
          MERCHANT_ADDRESS: ${{ secrets.MERCHANT_ADDRESS }}
        run: |
          mkdir -p .aegis_console
          set +e
          npm run agent:simulate -- "${{ inputs.intent }}" > .aegis_console/simulate.stdout.log 2> .aegis_console/simulate.stderr.log
          EXIT_CODE=$?
          echo "${EXIT_CODE}" > .aegis_console/simulate.exitcode.txt
          set -e

          node - << 'NODE'
          const fs = require("fs");
          const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "");
          const raw = read(".aegis_console/simulate.stdout.log");
          const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
          const last = lines[lines.length - 1] || "";
          if (!last.startsWith("{")) {
            fs.writeFileSync(".aegis_console/simulate.extract_error.log", "Last line is not JSON.\nLAST:\n" + last + "\n\nRAW(head):\n" + raw.slice(0, 2000));
            process.exit(0);
          }
          try {
            const obj = JSON.parse(last);
            fs.writeFileSync(".aegis_console/simulate.json", JSON.stringify(obj, null, 2));
          } catch (e) {
            fs.writeFileSync(".aegis_console/simulate.extract_error.log", "JSON parse failed: " + String(e) + "\nLAST:\n" + last);
          }
          NODE

      - name: Debug simulate logs (always)
        if: always()
        run: |
          echo "---- simulate.exitcode ----"
          cat .aegis_console/simulate.exitcode.txt || true
          echo ""
          echo "---- simulate.stderr (first 200 lines) ----"
          sed -n '1,200p' .aegis_console/simulate.stderr.log || true
          echo ""
          echo "---- simulate.stdout (first 50 lines) ----"
          sed -n '1,50p' .aegis_console/simulate.stdout.log || true
          echo ""
          echo "---- simulate.extract_error ----"
          cat .aegis_console/simulate.extract_error.log || true

      # -------------------------
      # VALIDATE (Vault read + gate)
      # -------------------------
      - name: Agent validate (stdout JSON)
        id: validate
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          DESTINATION_ADDRESS: ${{ secrets.DESTINATION_ADDRESS }}
          MERCHANT_ADDRESS: ${{ secrets.MERCHANT_ADDRESS }}

          ARC_TESTNET_RPC_PRIMARY: ${{ secrets.ARC_TESTNET_RPC_PRIMARY }}
          VAULT_ADDRESS: ${{ secrets.VAULT_ADDRESS }}
        run: |
          mkdir -p .aegis_console
          set +e
          npm run agent:validate -- "${{ inputs.intent }}" > .aegis_console/validate.stdout.log 2> .aegis_console/validate.stderr.log
          EXIT_CODE=$?
          echo "${EXIT_CODE}" > .aegis_console/validate.exitcode.txt
          set -e

          node - << 'NODE'
          const fs = require("fs");
          const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "");
          const raw = read(".aegis_console/validate.stdout.log");
          const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
          const last = lines[lines.length - 1] || "";
          if (!last.startsWith("{")) {
            fs.writeFileSync(".aegis_console/validate.extract_error.log", "Last line is not JSON.\nLAST:\n" + last + "\n\nRAW(head):\n" + raw.slice(0, 2000));
            process.exit(0);
          }
          try {
            const obj = JSON.parse(last);
            fs.writeFileSync(".aegis_console/validate.json", JSON.stringify(obj, null, 2));
            fs.writeFileSync(".aegis_console/validate_status.txt", String(obj.status || ""));
          } catch (e) {
            fs.writeFileSync(".aegis_console/validate.extract_error.log", "JSON parse failed: " + String(e) + "\nLAST:\n" + last);
          }
          NODE

      - name: Debug validate logs (always)
        if: always()
        run: |
          echo "---- validate.exitcode ----"
          cat .aegis_console/validate.exitcode.txt || true
          echo ""
          echo "---- validate.stderr (first 200 lines) ----"
          sed -n '1,200p' .aegis_console/validate.stderr.log || true
          echo ""
          echo "---- validate.stdout (first 50 lines) ----"
          sed -n '1,50p' .aegis_console/validate.stdout.log || true
          echo ""
          echo "---- validate.extract_error ----"
          cat .aegis_console/validate.extract_error.log || true
          echo ""
          echo "---- validate_status ----"
          cat .aegis_console/validate_status.txt || true

      # should_execute gate (only for EXECUTE mode)
      - name: Determine execute gate
        if: always()
        run: |
          mkdir -p .aegis_console
          MODE="$(cat .aegis_console/mode.txt 2>/dev/null || echo '')"
          STATUS="$(cat .aegis_console/validate_status.txt 2>/dev/null || echo '')"
          if [ "${MODE}" = "EXECUTE" ] && [ "${STATUS}" = "APPROVED_READY" ]; then
            echo "true" > .aegis_console/should_execute.txt
          else
            echo "false" > .aegis_console/should_execute.txt
          fi
          echo "mode=${MODE}"
          echo "validate_status=${STATUS}"
          echo "should_execute=$(cat .aegis_console/should_execute.txt)"

      # -------------------------
      # EXECUTE via GitHub Actions workflow (circle_spend_vault.yml)
      # -------------------------
      - name: Dispatch circle_spend_vault (EXECUTE only)
        id: dispatch
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ secrets.GITHUB_OWNER }}
          REPO: ${{ secrets.GITHUB_REPO }}
          WORKFLOW_FILE: ${{ secrets.GITHUB_WORKFLOW_FILE }} # circle_spend_vault.yml
        run: |
          set -e
          SHOULD="$(cat .aegis_console/should_execute.txt)"
          if [ "${MODE}" != "EXECUTE" ] || [ "${SHOULD}" != "true" ]; then
            echo "skip dispatch (mode=${MODE}, should_execute=${SHOULD})"
            echo "run_id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Need simulate.json for to/amount
          if [ ! -f ".aegis_console/simulate.json" ]; then
            echo "Missing .aegis_console/simulate.json (cannot dispatch execute)"
            echo "run_id=" >> $GITHUB_OUTPUT
            exit 0
          fi

          TO=$(node -p "require('./.aegis_console/simulate.json').to")
          AMOUNT=$(node -p "require('./.aegis_console/simulate.json').amount")

          echo "Dispatching workflow: ${WORKFLOW_FILE} to=${TO} amount=${AMOUNT}"

          # Dispatch workflow
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"to\":\"${TO}\",\"amount\":\"${AMOUNT}\"}}"

          echo "dispatched=true" >> $GITHUB_OUTPUT
          echo "to=${TO}" >> $GITHUB_OUTPUT
          echo "amount=${AMOUNT}" >> $GITHUB_OUTPUT

      # NOTE: Polling for artifacts/run results can be implemented more deeply,
      # but we keep it minimal and deterministic:
      # - The UI consumes console_result.json from THIS workflow
      # - circle_spend_vault workflow already uploads circle_result.json artifact
      # - For now, we only surface dispatch metadata and rely on orchestrator/github/dispatch.ts later if needed.

      # -------------------------
      # Build console_result.json (deterministic)
      # -------------------------
      - name: Build console_result.json
        if: always()
        run: |
          node - << 'NODE'
          const fs = require("fs");

          const read = (p) => (fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "");
          const readJSON = (p) => {
            try {
              const t = read(p).trim();
              if (!t) return null;
              return JSON.parse(t);
            } catch (e) {
              return { _parseError: String(e), _raw: read(p).slice(0, 4000) };
            }
          };

          const mode = read(".aegis_console/mode.txt").trim();
          const intent = read(".aegis_console/intent.txt").trim();

          const simulate = readJSON(".aegis_console/simulate.json");
          const validate = readJSON(".aegis_console/validate.json");

          const shouldExecute = read(".aegis_console/should_execute.txt").trim() === "true";

          // If you later add polling, fill these from real parsed files:
          const circleTxId = read(".aegis_console/circleTxId.txt").trim();
          const txHash = read(".aegis_console/txHash.txt").trim();

          const simulateErr = read(".aegis_console/simulate.stderr.log").trim();
          const validateErr = read(".aegis_console/validate.stderr.log").trim();

          const res = {
            mode,
            intent,
            simulate,
            validate,
            execute: null,
            errors: {
              simulateStderr: simulateErr || null,
              validateStderr: validateErr || null,
            },
            meta: {
              shouldExecute,
              workflow: "aegis-console",
              dispatched: mode === "EXECUTE" && shouldExecute ? true : false
            }
          };

          if (mode === "EXECUTE") {
            if (!validate || validate?.status !== "APPROVED_READY") {
              res.execute = {
                status: "BLOCKED",
                reason: validate?.reason || "Blocked by validation gate.",
                message: "No execution occurred. Funds did not move."
              };
            } else if (!shouldExecute) {
              res.execute = {
                status: "BLOCKED",
                reason: "Validation approved but execution gate did not run.",
                message: "No execution occurred. Funds did not move."
              };
            } else if (txHash) {
              res.execute = {
                status: "APPROVED",
                circleTxId: circleTxId || null,
                txHash,
              };
            } else {
              // Dispatch happened but we did not poll for txHash here (by design for this checkpoint)
              res.execute = {
                status: "PENDING",
                reason: "Execution dispatched. Polling for txHash is handled in the next checkpoint.",
                message: "Execution was dispatched via GitHub Actions."
              };
            }
          }

          fs.writeFileSync("console_result.json", JSON.stringify(res, null, 2));
          console.log("Wrote console_result.json");
          NODE

      - name: Summary (human-readable)
        if: always()
        run: |
          node - << 'NODE'
          const fs = require("fs");

          const p = "console_result.json";
          if (!fs.existsSync(p)) {
            console.log("No console_result.json found.");
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(p, "utf8"));

          const mode = r.mode || "UNKNOWN";
          const intent = (r.intent || "").trim();

          const sim = r.simulate || null;
          const v = r.validate || null;
          const vault = v?.vault || null;
          const exe = r.execute || null;

          console.log("========================================");
          console.log("AEGIS Agent Console — Workflow Summary");
          console.log("========================================");
          console.log(`Mode:   ${mode}`);
          console.log(`Intent: ${intent || "(empty)"}`);
          console.log("");

          if (sim) {
            console.log("SIMULATE");
            console.log(`- to:       ${sim.to ?? "-"}`);
            console.log(`- amount:   ${sim.amount ?? "-"}`);
            console.log(`- currency: ${sim.currency ?? "-"}`);
            console.log(`- reason:   ${sim.reason ?? "-"}`);
            console.log("");
          } else {
            console.log("SIMULATE: (no output)\n");
          }

          if (v) {
            console.log("VALIDATE");
            console.log(`- status: ${v.status ?? "-"}`);
            console.log(`- reason: ${v.reason ?? "-"}`);
            if (vault) {
              console.log("VAULT STATE");
              console.log(`- maxPerTx:    ${vault.maxPerTx ?? "-"}`);
              console.log(`- dailyLimit:  ${vault.dailyLimit ?? "-"}`);
              console.log(`- spentToday:  ${vault.spentToday ?? "-"}`);
            }
            console.log("");
          } else {
            console.log("VALIDATE: (no output)\n");
          }

          if (mode === "EXECUTE") {
            console.log("EXECUTE");
            if (!exe) {
              console.log("- No execution data present.\n");
            } else {
              console.log(`- status: ${exe.status ?? "UNKNOWN"}`);
              if (exe.reason) console.log(`- reason: ${exe.reason}`);
              if (exe.txHash) console.log(`- txHash:  ${exe.txHash}`);
              if (exe.status === "BLOCKED") console.log("- note:   No execution occurred. Funds did not move.");
              console.log("");
            }
          }

          console.log("Artifact: aegis-console-result / console_result.json");
          console.log("========================================");
          NODE

      - name: Upload console_result.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-console-result
          path: console_result.json
          retention-days: 1

      - name: Upload debug workspace (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-console-debug
          path: .aegis_console
          include-hidden-files: true
          retention-days: 1
