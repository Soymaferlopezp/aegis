name: circle-w3s-vault-spend

on:
  workflow_dispatch:

jobs:
  spend:
    runs-on: ubuntu-latest
    env:
      CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
      CIRCLE_ENTITY_SECRET_HEX: ${{ secrets.CIRCLE_ENTITY_SECRET_HEX }}
      CIRCLE_BASE_URL: "https://api.circle.com/v1/w3s"
      CIRCLE_BLOCKCHAIN: "ARC-TESTNET"
      CIRCLE_WALLET_ID_AGENT: ${{ secrets.CIRCLE_WALLET_ID_AGENT }}
      VAULT_ADDRESS: "0x3fFd55E53D7740a93b8B62e93ed11a2c0651098E"
      SPEND_ABI_PARAMS_JSON: ${{ secrets.SPEND_ABI_PARAMS_JSON }}
      ARC_EXPLORER_TX: "https://testnet.arcscan.app/tx/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          npm ci || npm install
      - name: Call spend() on Vault
        run: npx ts-node scripts/circle/07_callSpend_vault.ts