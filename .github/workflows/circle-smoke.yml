name: circle-w3s-create-wallets

on:
  workflow_dispatch:

jobs:
  create_wallets:
    runs-on: ubuntu-latest
    env:
      CIRCLE_API_KEY: ${{ secrets.CIRCLE_API_KEY }}
      CIRCLE_ENTITY_SECRET_HEX: ${{ secrets.CIRCLE_ENTITY_SECRET_HEX }}
      CIRCLE_WALLET_SET_ID: ${{ secrets.CIRCLE_WALLET_SET_ID }}
      CIRCLE_BASE_URL: "https://api.circle.com/v1/w3s"
      CIRCLE_BLOCKCHAIN: "ARC"
      ARC_EXPLORER_TX: "https://testnet.arcscan.app/tx/"
      VAULT_ADDRESS: "0x3fFd55E53D7740a93b8B62e93ed11a2c0651098E"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          npm ci || npm install
      - name: Create Wallets (ARC) - agent + receiver
        run: npx ts-node scripts/circle/02_createWallets_arc.ts
